name: Enviar boletín semanal

# El martes envía el resumen a las 13:00 de Argentina. NO vuelve a rastrear los
# sitios: lee docs/datos.json, que publicó la corrida del lunes. Si esa
# corrida fue abortada por la guardia de datos, el boletín usa lo último
# publicado (y se niega a enviar si no hay convocatorias).
on:
  schedule:
    - cron: '0 16 * * 2'   # martes 13:00 Argentina (UTC-3)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/boletin.yml'

permissions:
  contents: read

concurrency:
  group: boletin-semanal
  cancel-in-progress: false

jobs:
  enviar:
    # El push solo sirve como recuperación/prueba cuando el commit lleva
    # explícitamente la marca [enviar-boletin]. Los cambios normales del
    # workflow no mandan correos por accidente.
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[enviar-boletin]')
    name: Enviar boletín
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements-ci.txt

      - name: Enviar resumen semanal
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          BOLETIN_SUSCRIPTORES: ${{ secrets.BOLETIN_SUSCRIPTORES }}
          BOLETIN_FUENTE: publicado
        run: python boletin_ci.py

      - name: Registrar resultado
        if: always()
        run: |
          echo "## Boletín semanal" >> "$GITHUB_STEP_SUMMARY"
          echo "Objetivo de envío: martes 13:00 (America/Argentina/Buenos_Aires)" >> "$GITHUB_STEP_SUMMARY"
          echo "Ejecución: $(TZ='America/Argentina/Buenos_Aires' date +'%d/%m/%Y %H:%M')" >> "$GITHUB_STEP_SUMMARY"
          echo "Estado: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
